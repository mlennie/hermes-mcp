name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src/

      - name: Tests (pytest)
        run: pytest

  container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Traefik Compose example
        env:
          HERMES_MCP_ENV_FILE: ./hermes-mcp.env.example
        run: >-
          docker compose
          --env-file deploy/hermes-mcp.env.example
          -f deploy/docker-compose.traefik.yml
          config --quiet

      - name: Validate Hostinger sidecar Compose example
        env:
          HERMES_MCP_ENV_FILE: ../../deploy/hermes-mcp.env.example
          HERMES_MCP_BUILD_CONTEXT: ../..
        run: >-
          docker compose
          --env-file deploy/hermes-mcp.env.example
          -f .github/fixtures/docker-compose.hostinger-base.yml
          -f deploy/docker-compose.hostinger-sidecar.yml
          config --quiet

      - name: Build container image
        run: docker build --tag hermes-mcp:ci .
